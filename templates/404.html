<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link not found — FlaskIDE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
  (function () {
    try {
      var saved = localStorage.getItem("flaskide-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch (e) { /* storage blocked; the CSS default still applies */ }
  })();
</script>
</head>
<body>
  <div class="center">
    <h1>That share link doesn't exist</h1>
    <p>The link may have been typed incorrectly, or the project was never shared.
       Double-check the address with whoever sent it to you.</p>
    <a class="btn btn-primary" href="{{ url_for('index') }}">Start a new project</a>
  </div>
</body>
</html>
